name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gamba-league-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      CLOUDSDK_CORE_PROJECT: gamba-league
      GCP_WORKLOAD_IDENTITY_PROVIDER: projects/751417505273/locations/global/workloadIdentityPools/github-deploy/providers/github-main
      GCP_DEPLOY_SERVICE_ACCOUNT: github-deploy@gamba-league.iam.gserviceaccount.com
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm ci --prefix functions
      - run: npm run lint
      - run: npm test
      - run: npx --no-install tsc --noEmit
      - run: npm run build
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: gamba-league
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Deploy Cloud Run
        run: >-
          gcloud run deploy gamba-league-web
          --source .
          --region us-central1
          --project gamba-league
          --quiet
      - name: Route traffic to the new revision
        run: gcloud run services update-traffic gamba-league-web --to-latest --region us-central1 --project gamba-league --quiet
      - name: Refresh credentials before Hosting deployment
        uses: google-github-actions/auth@v3
        with:
          project_id: gamba-league
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: Deploy Firebase Hosting
        run: npx --no-install firebase deploy --only hosting --project gamba-league --non-interactive
      - name: Check public site
        run: curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 10 --max-time 60 https://gamba-league.web.app/ --output /dev/null
      - name: Deployment summary
        run: |
          echo "Deployed commit $GITHUB_SHA to Cloud Run and Firebase Hosting." >> "$GITHUB_STEP_SUMMARY"
          echo 'Site: https://gamba-league.web.app/' >> "$GITHUB_STEP_SUMMARY"
